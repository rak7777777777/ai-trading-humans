name: Publish index page
on:
  push:
    paths:
      - .github/workflows/publish-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified page
        run: |
          curl -fL --retry 3 'https://customer-assets-7cd3h4nn.emergentagent.net/wingman/4f01eb7a-22f3-4901-8ff3-8bf1623fb9c0/attachments/c41fec2215d6451eb6516a3a1715fcee_index.html' -o index.html
          echo 'db526738886bc9516826d2a604cdea4d99cf6ffe66455b4a5a62c082e257d4cd  index.html' | sha256sum -c -
          test $(wc -c < index.html) -eq 62754
      - name: Commit index page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish AI Trading Humans page'
          git push
