name: One-time analytics host update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only analytics host and verify exact output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          old = p.read_bytes()
          assert len(old) == 62754, len(old)
          assert hashlib.sha256(old).hexdigest() == 'db526738886bc9516826d2a604cdea4d99cf6ffe66455b4a5a62c082e257d4cd'
          before = b'aitradinghumans.goatcounter.com'
          after = b'rakesh123.goatcounter.com'
          assert old.count(before) == 1 and old.count(after) == 0
          new = old.replace(before, after)
          assert len(new) == 62748 and hashlib.sha256(new).hexdigest() == '03876485b059d82fec0fc3d0e9916b8c5c29cf65ce2f379483851674970db9be'
          p.write_bytes(new)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'fix: point GoatCounter at rakesh123'
          git push origin HEAD:main
